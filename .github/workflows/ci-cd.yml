name: ERP CI/CD Pipeline

on:
push:
branches:
- main
- develop
pull_request:
branches:
- main

env:
NODE_VERSION: '22'

jobs:
quality:
name: Code Quality
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
      cache: npm

  - name: Install Dependencies
    run: npm ci

  - name: Type Check
    run: npx tsc --noEmit

  - name: Production Build
    run: npm run build

  - name: Bundle Size Check
    run: |
      SIZE=$(stat -c%s dist/index.html)
      echo "Bundle size: $SIZE bytes"

      if [ "$SIZE" -gt 1500000 ]; then
        echo "Bundle exceeds 1.5MB limit"
        exit 1
      fi
```

security:
name: Security Audit
runs-on: ubuntu-latest
needs: quality

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
      cache: npm

  - name: Install Dependencies
    run: npm ci

  - name: NPM Audit
    run: npm audit --production
    continue-on-error: true

  - name: Secret Scan
    run: |
      if grep -R "neondb_owner\|npg_" src/ \
         --include="*.ts" \
         --include="*.tsx" \
         --include="*.js" \
         --include="*.jsx"; then
        echo "Hardcoded credentials detected"
        exit 1
      fi
```

database:
name: Database Connectivity Test
runs-on: ubuntu-latest
needs: quality

```
if: github.event_name == 'push'

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Verify Database Connection
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    run: |
      if [ -z "$DATABASE_URL" ]; then
        echo "DATABASE_URL not configured"
        exit 0
      fi

      npm install pg

      node -e "
      const { Pool } = require('pg');

      const pool = new Pool({
        connectionString: process.env.DATABASE_URL,
        ssl: { rejectUnauthorized: false }
      });

      pool.query('SELECT NOW()')
        .then(() => {
          console.log('Database connection successful');
          pool.end();
        })
        .catch(err => {
          console.error(err.message);
          process.exit(1);
        });
      "
```

deploy:
name: Deploy Frontend
runs-on: ubuntu-latest

```
needs:
  - quality
  - security
  - database

if: github.ref == 'refs/heads/main' && github.event_name == 'push'

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
      cache: npm

  - name: Install Dependencies
    run: npm ci

  - name: Build Application
    env:
      VITE_FORCE_LOCAL: true
    run: npm run build

  - name: Install Latest Vercel CLI
    run: npm install --global vercel@latest

  - name: Pull Vercel Configuration
    run: |
      vercel pull \
        --yes \
        --environment=production \
        --token=${{ secrets.VERCEL_TOKEN }}

  - name: Build Vercel Project
    run: |
      vercel build \
        --prod \
        --token=${{ secrets.VERCEL_TOKEN }}

  - name: Deploy To Production
    run: |
      vercel deploy \
        --prebuilt \
        --prod \
        --token=${{ secrets.VERCEL_TOKEN }}
```

deploy-backend:
name: Deploy Backend
runs-on: ubuntu-latest

```
needs:
  - quality
  - security

if: github.ref == 'refs/heads/main' && github.event_name == 'push'

steps:
  - name: Trigger Render Deployment
    run: |
      curl -X POST \
        "https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}" \
        -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
```
