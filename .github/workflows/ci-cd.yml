name: ERP CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════
  # JOB 1: Quality Checks
  # ═══════════════════════════════════════════════════════
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          SIZE=$(stat -f%z dist/index.html 2>/dev/null || stat -c%s dist/index.html)
          echo "Bundle size: $SIZE bytes"
          if [ $SIZE -gt 1500000 ]; then
            echo "❌ Bundle too large (>1.5MB)"
            exit 1
          fi
          echo "✅ Bundle size OK"

  # ═══════════════════════════════════════════════════════
  # JOB 2: Security Audit
  # ═══════════════════════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --production
        continue-on-error: true

      - name: Check for secrets
        run: |
          echo "🔍 Scanning for hardcoded credentials..."
          if grep -r "neondb_owner\|npg_" --include="*.ts" --include="*.tsx" --include="*.js" src/ 2>/dev/null; then
            echo "❌ CRITICAL: Found hardcoded database credentials in frontend code!"
            echo "🛡️  Credentials must stay in backend only (server/index.js via env vars)"
            exit 1
          fi
          echo "✅ No hardcoded credentials found in frontend"

  # ═══════════════════════════════════════════════════════
  # JOB 3: Database Tests
  # ═══════════════════════════════════════════════════════
  database:
    name: Database Tests
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Neon connection
        if: env.DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Testing Neon PostgreSQL connection..."
          node -e "const { Pool } = require('pg'); const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } }); pool.query('SELECT 1', (err) => { if (err) { console.error('❌ DB Error:', err.message); process.exit(1); } console.log('✅ Database connected'); pool.end(); });"

  # ═══════════════════════════════════════════════════════
  # JOB 4: Deploy to Vercel (production)
  # ═══════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality, security, database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FORCE_LOCAL: 'true'

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # ═══════════════════════════════════════════════════════
  # JOB 5: Deploy Backend to Render
  # ═══════════════════════════════════════════════════════
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [quality, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }} \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
